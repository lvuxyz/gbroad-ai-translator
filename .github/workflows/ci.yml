name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Windows)
    # The application talks to the Win32 clipboard, registry and hotkey APIs,
    # so the suite only runs meaningfully on Windows.
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Byte-compile every module
        run: python -m compileall -q config.py database.py main.py core providers ui utils

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
